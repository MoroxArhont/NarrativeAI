<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Narrative AI — интерактивные истории вместе с ИИ</title>
    <meta
      name="description"
      content="Создавайте интерактивные истории, персонажей и миры вместе с искусственным интеллектом. Поддержка локальных моделей Ollama и LM Studio."
    />
    <meta name="theme-color" content="#121212" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/dist/output.css" />
    <style>
      :root {
        --bg: #121212;
        --side: #18181b;
        --card: #202024;
        --input: #2c2c31;
        --purple: #8b5cf6;
        --purple2: #7c3aed;
        --muted: #9ca3af;
        --line: #333338;
        --white: #f8fafc;
        --danger: #ef4444;
        --green: #34d399;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--white);
        font-family: Inter, sans-serif;
        min-height: 100vh;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .hidden {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .auth-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 16px;
        background: radial-gradient(ellipse at 50% 15%, #321b59 0%, #17121f 35%, var(--bg) 72%);
      }
      .auth-wrap {
        width: 100%;
        max-width: 430px;
      }
      .brand {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 2px;
        text-align: center;
        color: #c4b5fd;
        margin-bottom: 28px;
      }
      .auth-card,
      .panel {
        background: rgba(32, 32, 36, 0.92);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 28px;
        box-shadow: 0 18px 60px #0005;
      }
      .auth-card h1 {
        font-size: 21px;
        margin: 0 0 8px;
      }
      .auth-card .sub {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.55;
        margin: 0 0 22px;
      }
      .tabs {
        display: flex;
        background: var(--input);
        padding: 4px;
        border-radius: 9px;
        margin-bottom: 20px;
      }
      .tab {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 10px;
        border-radius: 7px;
      }
      .tab.active {
        background: var(--purple);
        color: white;
      }
      .field {
        display: block;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--input);
        color: white;
        margin: 8px 0 14px;
        outline: none;
      }
      .field:focus {
        border-color: var(--purple);
      }
      label {
        font-size: 12px;
        color: #d1d5db;
      }
      .btn {
        border: 0;
        border-radius: 8px;
        padding: 11px 16px;
        font-weight: 600;
        transition: 0.2s;
      }
      .btn-primary {
        background: var(--purple);
        color: white;
      }
      .btn-primary:hover {
        background: var(--purple2);
      }
      .btn-secondary {
        background: transparent;
        color: white;
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        border-color: #777;
      }
      .btn-block {
        width: 100%;
      }
      .error {
        font-size: 12px;
        color: #f87171;
        min-height: 18px;
        margin: 8px 0;
      }
      .auth-foot {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: 17px;
      }
      .link {
        color: #c4b5fd;
        background: none;
        border: 0;
        padding: 0;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px 1fr;
      }
      .sidebar {
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 22px 16px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .logo {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 1px;
        margin: 4px 8px 34px;
      }
      .logo i {
        color: var(--purple);
        margin-right: 9px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        border: 0;
        text-align: left;
        background: transparent;
        color: var(--muted);
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
      }
      .nav button i {
        width: 23px;
      }
      .nav button:hover,
      .nav button.active {
        background: #8b5cf622;
        color: #c4b5fd;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .create-nav {
        width: 100%;
        margin-bottom: 12px;
      }
      .user-mini {
        border-top: 1px solid var(--line);
        padding: 15px 5px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #4c1d95);
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .main {
        min-width: 0;
        min-height: 100vh;
      }
      .topbar {
        height: 72px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
      }
      .topbar h2 {
        font-size: 16px;
        margin: 0;
      }
      .content {
        padding: 30px 34px 60px;
        max-width: 1200px;
        margin: auto;
      }
      .hero {
        background: linear-gradient(115deg, #241b35, #202024 65%);
        border: 1px solid #49356c;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 28px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.3px;
        text-transform: uppercase;
        color: #c4b5fd;
      }
      .hero h1 {
        font-size: 25px;
        line-height: 1.35;
        max-width: 650px;
        margin: 12px 0;
      }
      .hero p {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
        max-width: 620px;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 28px 0 14px;
      }
      .section-head h3 {
        font-size: 16px;
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }
      .feature,
      .story-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 19px;
      }
      .feature i {
        font-size: 19px;
        color: #a78bfa;
        margin-bottom: 15px;
      }
      .feature h4 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .feature p,
      .story-card p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      .story-card {
        cursor: pointer;
        transition: 0.2s;
      }
      .story-card:hover {
        border-color: #8b5cf6;
        transform: translateY(-2px);
      }
      .story-card h4 {
        font-size: 14px;
        margin: 0 0 9px;
      }
      .pill {
        display: inline-block;
        font-size: 10px;
        color: #c4b5fd;
        background: #8b5cf622;
        padding: 5px 8px;
        border-radius: 20px;
        margin-bottom: 12px;
      }
      .empty {
        border: 1px dashed #45454d;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .page-title {
        font-size: 22px;
        margin: 0 0 7px;
      }
      .page-sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 24px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .form-grid .wide {
        grid-column: 1/-1;
      }
      .textarea {
        min-height: 100px;
        resize: vertical;
      }
      .story-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        gap: 18px;
      }
      .chat-panel {
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 65vh;
      }
      .chat-head {
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
      }
      .chat-head h3 {
        font-size: 15px;
        margin: 0 0 5px;
      }
      .chat-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: 1;
        overflow: auto;
        max-height: 55vh;
      }
      .bubble {
        max-width: 85%;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
      }
      .bubble.user {
        align-self: flex-end;
        background: #55349a;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: #2b2b32;
      }
      .chat-compose {
        border-top: 1px solid var(--line);
        padding: 14px;
        display: flex;
        gap: 10px;
      }
      .chat-compose textarea {
        flex: 1;
        min-height: 44px;
        max-height: 120px;
        resize: vertical;
        background: var(--input);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: white;
        padding: 11px;
      }
      .side-info {
        padding: 18px;
      }
      .side-info h4 {
        font-size: 13px;
        margin: 0 0 14px;
      }
      .side-info p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }
      .settings-card {
        max-width: 680px;
      }
      .status {
        font-size: 12px;
        color: var(--green);
        margin-top: 10px;
      }
      .danger {
        color: #f87171;
      }
      .story-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: #29242f;
        border: 1px solid #60448a;
        padding: 13px 17px;
        border-radius: 9px;
        font-size: 13px;
        z-index: 10;
        box-shadow: 0 8px 30px #0008;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 210px 1fr;
        }
        .grid {
          grid-template-columns: 1fr 1fr;
        }
        .story-layout {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 650px) {
        .app {
          display: block;
        }
        .sidebar {
          min-height: auto;
          padding: 12px;
          position: sticky;
          top: 0;
          z-index: 4;
        }
        .logo {
          margin: 4px 8px 12px;
        }
        .nav {
          display: flex;
          overflow: auto;
        }
        .nav button {
          white-space: nowrap;
          padding: 9px;
        }
        .sidebar-bottom {
          display: none;
        }
        .topbar {
          height: 58px;
          padding: 0 16px;
        }
        .content {
          padding: 20px 15px;
        }
        .hero {
          padding: 22px;
        }
        .hero h1 {
          font-size: 21px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-grid .wide {
          grid-column: auto;
        }
        .auth-card {
          padding: 23px;
        }
        .brand {
          font-size: 25px;
        }
        .chat-body {
          max-height: 50vh;
        }
      }

      .avatar-img {
        display: block;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #8b5cf6;
      }
      .editor-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .editor-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        margin: 10px 0 18px;
      }
      .editor-tabs button {
        background: transparent;
        color: var(--muted);
        border: 0;
        padding: 12px 14px;
        border-bottom: 2px solid transparent;
        font-size: 12px;
      }
      .editor-tabs button.active {
        color: #c4b5fd;
        border-color: var(--purple);
      }
      .editor-section {
        max-width: 900px;
      }
      .editor-section h3,
      .panel h3 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .hint {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
        margin: 5px 0 14px;
      }
      .large-textarea {
        min-height: 210px;
      }
      .editor-footer {
        display: flex;
        gap: 10px;
        margin: 18px 0 40px;
      }
      .image-preview {
        height: 150px;
        border: 1px dashed #555;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        margin: 12px 0;
      }
      .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .settings-stack {
        display: grid;
        gap: 15px;
        max-width: 850px;
      }
      .setting-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }
      .setting-title h3 {
        margin: 0;
      }
      .setting-title .hint {
        margin-bottom: 0;
      }
      .setting-row {
        margin-top: 17px;
      }
      .setting-row label {
        display: block;
        margin-bottom: 6px;
      }
      .setting-row .field {
        max-width: 100%;
        margin-bottom: 0;
      }
      .range {
        width: 100%;
        accent-color: var(--purple);
      }
      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 0;
        border-top: 1px solid var(--line);
      }
      .toggle-row label:first-child {
        font-size: 12px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch span {
        position: absolute;
        inset: 0;
        background: #45454d;
        border-radius: 20px;
        transition: 0.2s;
        cursor: pointer;
      }
      .switch span:before {
        content: '';
        position: absolute;
        width: 16px;
        height: 16px;
        left: 3px;
        top: 3px;
        background: white;
        border-radius: 50%;
        transition: 0.2s;
      }
      .switch input:checked + span {
        background: var(--purple);
      }
      .switch input:checked + span:before {
        transform: translateX(18px);
      }
      .disabled-fields {
        opacity: 0.35;
        pointer-events: none;
      }
      .profile-edit-head {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 24px;
      }
      .profile-edit-head h3 {
        margin: 0 0 5px;
      }
      .profile-edit-head p {
        margin: 0;
      }
      .soft-hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 22px 0;
      }
      .story-cover-thumb {
        width: 100%;
        height: 125px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .story-cover-placeholder {
        height: 125px;
        border-radius: 8px;
        background: linear-gradient(135deg, #43306a, #28384b);
        display: grid;
        place-items: center;
        color: #c4b5fd;
        font-size: 28px;
        margin-bottom: 12px;
      }
      .story-profile-head {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 22px;
        align-items: center;
        margin-bottom: 18px;
      }
      .story-profile-head > img,
      .story-cover-placeholder.big {
        width: 180px;
        height: 140px;
        object-fit: cover;
        border-radius: 10px;
      }
      .story-profile-head h1 {
        font-size: 22px;
        margin: 8px 0;
      }
      .profile-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .profile-info-grid .panel {
        min-height: 120px;
      }
      .wide-panel {
        grid-column: 1/-1;
      }
      .plain-list {
        padding-left: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      .chat-panel {
        min-height: 70vh;
        background-image: linear-gradient(#1d1d21dd, #1d1d21dd), var(--chat-bg-image);
        background-size: cover;
        background-position: center;
      }
      .chat-panel .chat-body {
        max-height: none;
        min-height: 45vh;
      }
      .chat-title-line {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chat-title-line h3 {
        margin: 0 0 5px;
      }
      .chat-story-avatar {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
      }
      .editor-section .field {
        margin-bottom: 10px;
      }
      @media (max-width: 900px) {
        .story-profile-head {
          grid-template-columns: 120px 1fr;
        }
        .story-profile-head > img,
        .story-cover-placeholder.big {
          width: 120px;
          height: 120px;
        }
      }
      @media (max-width: 650px) {
        .editor-top {
          display: block;
        }
        .editor-top > .btn {
          margin-bottom: 12px;
        }
        .editor-tabs {
          overflow-x: auto;
          flex-wrap: nowrap;
        }
        .editor-tabs button {
          white-space: nowrap;
        }
        .profile-info-grid {
          grid-template-columns: 1fr;
        }
        .wide-panel {
          grid-column: auto;
        }
        .story-profile-head {
          grid-template-columns: 1fr;
        }
        .story-profile-head > img,
        .story-cover-placeholder.big {
          width: 100%;
          height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <section id="auth-screen" class="auth-screen">
      <div class="auth-wrap">
        <div class="brand">NARRATIVE AI</div>
        <div class="auth-card">
          <h1 id="auth-title">Добро пожаловать</h1>
          <p class="sub">
            Создавайте и проживайте интерактивные истории вместе с искусственным интеллектом.
          </p>
          <div class="tabs">
            <button class="tab active" id="login-tab" type="button">Вход</button
            ><button class="tab" id="register-tab" type="button">Регистрация</button>
          </div>
          <form id="auth-form">
            <div id="name-wrap" class="hidden">
              <label for="name">Ваше имя</label
              ><input
                class="field"
                id="name"
                maxlength="40"
                autocomplete="name"
                placeholder="Как к вам обращаться?"
              />
            </div>
            <label for="email">Электронная почта</label
            ><input
              class="field"
              id="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
            />
            <label for="password">Пароль</label
            ><input
              class="field"
              id="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="8"
              placeholder="Минимум 8 символов"
            />
            <div id="auth-error" class="error" role="alert"></div>
            <button class="btn btn-primary btn-block" id="auth-submit" type="submit">Войти</button>
          </form>
          <div class="auth-foot">Локальные модели и ваши истории — в одном пространстве.</div>
        </div>
      </div>
    </section>

    <div id="app-screen" class="app hidden">
      <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-circle-nodes"></i>NARRATIVE AI</div>
        <nav class="nav" aria-label="Основная навигация">
          <button data-page="home" class="active"><i class="fa-solid fa-house"></i>Главная</button>
          <button data-page="catalog"><i class="fa-solid fa-book-open"></i>Каталог историй</button>
          <button data-page="stories">
            <i class="fa-solid fa-clock-rotate-left"></i>Мои истории
          </button>
          <button data-page="profile"><i class="fa-solid fa-user"></i>Профиль</button>
          <button data-page="settings"><i class="fa-solid fa-sliders"></i>Настройки ИИ</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="btn btn-primary create-nav" id="create-nav">
            <i class="fa-solid fa-plus"></i> Создать историю
          </button>
          <div class="user-mini">
            <div id="side-avatar-wrap"><div class="avatar">N</div></div>
            <div>
